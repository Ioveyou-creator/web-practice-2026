<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>loveyou-creator 맞춤형 여행 계획 문의</title>
  <meta name="description" content="loveyou-creator의 맞춤형 여행 일정 및 코스 추천 문의 페이지입니다.">
  <meta property="og:title" content="loveyou-creator 맞춤형 여행 계획 문의">
  <meta property="og:description" content="원하는 여행 목적지와 코스 자유도에 맞춘 맞춤형 여행 플랜을 신청하세요.">
  <meta property="og:url" content="https://loveyou-creator.github.io/web-practice-2026/week3">
</head>
<body>
  <header>
    <h1>loveyou-creator 여행 플래너</h1>
  </header>

  <main>
    <section>
      <h2>플래너 소개</h2>
      <img src="profile.png" alt="loveyou-creator 여행 플래너 대표 프로필 이미지">
      <p>여행자의 취향과 일정에 맞춘 최적의 여행 경로와 코스를 설계해 드립니다.</p>
    </section>

    <section>
      <h2>여행 계획 문의하기</h2>
      <form method="post">
        <label for="name">이름</label><br>
        <input type="text" id="name" name="name" required>
        <br>

        <label for="email">이메일</label><br>
        <input type="email" id="email" name="email" required>
        <br>

        <label for="destination">목적지</label><br>
        <input type="text" id="destination" name="destination" placeholder="목적지를 입력해주세요" required>
        <br>

        <label for="period">기간</label><br>
        <input type="text" id="period" name="period" placeholder="예: 2박 3일" required>
        <br>

        <label for="course">코스 추천</label><br>
        <select id="course" name="course">
          <option value="low">자유도 하 (밀착 풀코스)</option>
          <option value="medium" selected>자유도 중 (명소 + 여유)</option>
          <option value="high">자유도 상 (자유 일정 중심)</option>
          <option value="healing">힐링 및 휴양 코스</option>
          <option value="gourmet">맛집 탐방 코스</option>
        </select>
        <br>

        <label for="message">문의내용</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="문의내용을 입력해주세요" required></textarea>
        <br>

        <button type="submit">보내기</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Copyright 2026 loveyou-creator. All rights reserved.</p>
    <p>문의 이메일: <a href="mailto:contact@loveyou-creator.com">contact@loveyou-creator.com</a></p>
  </footer>
</body>
</html>
